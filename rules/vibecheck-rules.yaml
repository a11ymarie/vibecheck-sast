# vibecheck-sast rules for JavaScript/TypeScript apps, especially ones built with AI assistants:
# Next.js and React front ends, Node/Express APIs, Supabase, Prisma, and AI SDKs.
#
# Each rule's metadata carries what the report and fix-tasks.md show:
#   title    plain-language name of the problem
#   level    critical | high | medium | low (Semgrep's own `severity` is kept in step)
#   confirm  how to tell whether a hit is real
#   impact   when it's serious, when it's minor, when it's a false positive
#   fix      what to change
#   kind     code (default) or rotate (a credential is exposed and must be replaced)
#
# Rule ids start with "vc-" and should stay stable: they appear in reports, .vibecheck.yml and ids.
# Tests: rules/tests/vibecheck-rules.tsx (semgrep --test).

rules:
  # ---------------------------------------------------------------------------------------------
  # Keys and secrets in code
  # ---------------------------------------------------------------------------------------------
  - id: vc-ai-key-in-browser
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      An AI SDK client is created with dangerouslyAllowBrowser: true, so its API key is sent to
      the browser, where anyone can copy it from devtools and spend your credits.
    metadata:
      title: AI API key exposed in the browser
      level: high
      kind: rotate
      cwe: "CWE-522: Insufficiently Protected Credentials"
      confirm: >-
        Check that this file runs in the browser (a "use client" component, a Vite/React SPA, an
        Expo app) and that the apiKey is a real provider key. In the running app, open devtools >
        Network, use the AI feature, and look for requests going straight to the provider.
      impact: >-
        High: a real provider key reaches the browser. Medium: it's a short-lived per-user token
        your server issued. False positive: the code only ever runs server-side.
      fix: >-
        Move the AI call into a server route or server action that reads the key from a
        server-only environment variable, call that route from the page, and rotate the key.
    pattern: "new $SDK({..., dangerouslyAllowBrowser: true, ...})"

  - id: vc-secret-fallback
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A secret has a hard-coded value: either a fallback such as process.env.JWT_SECRET || '...',
      or a literal passed to jwt.sign / jwt.verify. If the environment variable is ever missing
      (a typo, a new preview deployment), the app quietly uses a value anyone with the code knows,
      and for a signing secret that means anyone can forge a login.
    metadata:
      title: Hard-coded secret or secret fallback
      level: high
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confirm: >-
        Find what the value protects (token signing, encryption, an API). Then run the app
        locally with the variable unset: if it still starts and logins work, production would too.
      impact: >-
        High: it signs or encrypts sessions, or the repo is or was public. Medium: production
        always sets the variable. False positive: the value isn't secret, or it's test-only code.
      fix: >-
        Remove the fallback and stop at startup when the variable is missing, e.g.
        if (!process.env.JWT_SECRET) throw new Error('JWT_SECRET is not set'). Rotate the value
        if it was ever used in production.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: process.env.$NAME || "$VALUE"
                  - pattern: process.env.$NAME ?? "$VALUE"
              - metavariable-regex:
                  metavariable: $NAME
                  regex: (?i).*(secret|password|private|token|api_?key|signing|salt|encrypt).*
          - pattern: jwt.sign($PAYLOAD, "$VALUE", ...)
          - pattern: jwt.verify($TOKEN, "$VALUE", ...)
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.{6,}$

  - id: vc-secret-in-url
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      A token or key is put into a URL's query string. URLs end up in browser history, server and
      proxy logs, analytics, and the Referer header sent to other sites.
    metadata:
      title: Token or key in a URL
      level: medium
      cwe: "CWE-598: Use of GET Request Method With Sensitive Query Strings"
      confirm: >-
        Check what the value is: a login/session token or API key matters; a single-use,
        short-lived download token is usually acceptable.
      impact: >-
        High: a long-lived session token or API key. Medium: a short-lived token. False positive:
        a public value or a one-time token that expires in minutes.
      fix: >-
        Send it in a header (Authorization: Bearer ...) or a POST body instead. For download
        links, use a short-lived, single-use token minted for that purpose.
    pattern-regex: '[?&](access_token|refresh_token|token|api_?key|apikey|secret|password|session)=\$\{'

  # ---------------------------------------------------------------------------------------------
  # Injection
  # ---------------------------------------------------------------------------------------------
  - id: vc-sql-from-strings
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A SQL query is built by inserting values into the query text. If any of those values can
      come from a request, someone can change the query (SQL injection) and read or delete data.
    metadata:
      title: SQL built from strings (SQL injection)
      level: high
      cwe: "CWE-89: SQL Injection"
      confirm: >-
        Trace each inserted value back to its source. On a local or staging database only, send
        a value containing a single quote and see whether the query errors or behaves differently.
      impact: >-
        High: request input reaches the query. Medium: only admin input or stored data does.
        False positive: every inserted value is a constant or a validated number.
      fix: >-
        Use placeholders and pass values separately, e.g. db.query('... WHERE id = $1', [id]),
        or your query builder's parameter API.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $DB.$METHOD(`...${...}...`, ...)
              - pattern: $DB.$METHOD("..." + $X, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(query|execute|raw|unsafe|exec|all|get|run)$
          - metavariable-regex:
              metavariable: $DB
              regex: (?i).*(db|pool|client|conn|connection|knex|sequelize|sql|pg|mysql|database|tx|trx)$
      - pattern: $P.$queryRawUnsafe(`...${...}...`, ...)
      - pattern: $P.$executeRawUnsafe(`...${...}...`, ...)
      - pattern: $P.$queryRawUnsafe("..." + $X, ...)
      - pattern: $P.$executeRawUnsafe("..." + $X, ...)

  - id: vc-supabase-filter-injection
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      A Supabase .or() filter is built with string interpolation. Filter strings are a small
      query language, so a value containing a comma or parenthesis can add conditions, for
      example widening a search to rows the user shouldn't see.
    metadata:
      title: Supabase filter built from input
      level: medium
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      confirm: >-
        Trace the interpolated value to its source, and check which client runs the query: one
        made with the service role key skips Row Level Security. In the app, try a search value
        like x,id.gt.0 and see whether extra rows come back.
      impact: >-
        High: user input reaches it and the client uses the service role key, or the table has
        no RLS. Medium: RLS limits rows to the current user. False positive: the value is constant
        or strictly validated.
      fix: >-
        Use the typed filter methods (.ilike('title', `%${q}%`), .eq('id', id)) instead of a raw
        filter string, or strip , ( ) and " from the value first.
    pattern: $Q.or(`...${...}...`, ...)

  - id: vc-shell-command-from-input
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A shell command is built by inserting values into the command string. A value containing
      characters like ; or $( ) can run extra commands on your server.
    metadata:
      title: Shell command built from strings (command injection)
      level: high
      cwe: "CWE-78: OS Command Injection"
      confirm: >-
        Trace the inserted values to their source. Locally, pass a value such as "x; id" and see
        whether the extra command runs.
      impact: >-
        High: request input reaches the command. Medium: only trusted configuration does. False
        positive: all inserted values are constants.
      fix: >-
        Use execFile/spawn with an argument array (no shell), and validate the values against an
        allow-list.
    pattern-either:
      - pattern: $CP.exec(`...${...}...`, ...)
      - pattern: $CP.execSync(`...${...}...`, ...)
      - pattern: $CP.exec("..." + $X, ...)
      - pattern: $CP.execSync("..." + $X, ...)
      - pattern: exec(`...${...}...`, ...)
      - pattern: execSync(`...${...}...`, ...)
      - pattern: exec("..." + $X, ...)
      - pattern: execSync("..." + $X, ...)

  - id: vc-dynamic-code
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Code is built and run at runtime with eval or new Function. If any part of it can come from
      a request, someone can run their own code on your server or in your users' browsers.
    metadata:
      title: Code run from a string (eval)
      level: high
      cwe: "CWE-95: Eval Injection"
      confirm: >-
        Find where the evaluated string comes from. If any of it is user input, it's real.
      impact: >-
        High: user input reaches it. Medium: only trusted data does. False positive: the string
        is a constant.
      fix: >-
        Don't evaluate strings. Parse data with JSON.parse, or map allowed operations to
        functions in a lookup table.
    pattern-either:
      - patterns:
          - pattern: eval($X)
          - pattern-not: eval("...")
      - patterns:
          - pattern: new Function(..., $X)
          - pattern-not: new Function(..., "...")

  - id: vc-path-from-request
    languages: [typescript, javascript]
    mode: taint
    severity: ERROR
    message: >-
      A file path is built from request input, so a value like ../../.env can read or overwrite
      files outside the folder you meant (path traversal).
    metadata:
      title: File path built from request input (path traversal)
      level: high
      cwe: "CWE-22: Path Traversal"
      confirm: >-
        Locally, send a value containing ../ and see whether a file outside the intended folder is
        read or written.
      impact: >-
        High: it reads or writes files with the value. False positive: the value is checked
        against an allow-list or reduced to a plain file name first.
      fix: >-
        Use path.basename() on the value or map an id to a file name yourself, then check that
        the resolved path still starts with the intended folder.
    pattern-sources:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $URL.searchParams.get(...)
      - patterns:
          - pattern: $SP.get(...)
          - metavariable-regex:
              metavariable: $SP
              regex: ^(searchParams|params|query|qs|urlParams)$
      - pattern: (await $REQ.json())
      - pattern: (await $REQ.formData()).get(...)
    pattern-sanitizers:
      - pattern: path.basename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $FS.$FN($PATH, ...)
              - pattern: $FN($PATH, ...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(readFile|readFileSync|writeFile|writeFileSync|createReadStream|createWriteStream|unlink|unlinkSync|rm|rmSync|appendFile|appendFileSync|sendFile)$
          - focus-metavariable: $PATH

  - id: vc-server-fetches-user-url
    languages: [typescript, javascript]
    mode: taint
    severity: ERROR
    message: >-
      Your server fetches a URL that comes from the request. Someone can point it at internal
      addresses (http://169.254.169.254 for cloud credentials, localhost services) and read the
      responses (server-side request forgery).
    metadata:
      title: Server fetches a URL from the request (SSRF)
      level: high
      cwe: "CWE-918: Server-Side Request Forgery"
      confirm: >-
        Locally, send http://127.0.0.1:<some port> or http://169.254.169.254/ as the URL and see
        whether the server makes the request.
      impact: >-
        High: on servers or containers that can reach internal services or cloud metadata.
        Medium: on isolated serverless functions. False positive: the URL is checked against a
        fixed list of hosts first.
      fix: >-
        Allow only specific hosts, and reject private, loopback and link-local addresses after
        resolving the hostname.
    pattern-sources:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $URL.searchParams.get(...)
      - patterns:
          - pattern: $SP.get(...)
          - metavariable-regex:
              metavariable: $SP
              regex: ^(searchParams|params|query|qs|urlParams)$
      - pattern: (await $REQ.json())
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($TARGET, ...)
              - pattern: axios($TARGET, ...)
              - pattern: axios.$M($TARGET, ...)
              - pattern: got($TARGET, ...)
          - focus-metavariable: $TARGET

  - id: vc-open-redirect
    languages: [typescript, javascript]
    mode: taint
    severity: WARNING
    message: >-
      Users are redirected to an address taken from the request, so a link to your site can send
      people to any other site, which makes phishing links look trustworthy.
    metadata:
      title: Redirect target taken from the request (open redirect)
      level: medium
      cwe: "CWE-601: Open Redirect"
      confirm: >-
        Open the route with the parameter set to https://example.org and see whether the browser
        ends up there.
      impact: >-
        High: part of a login flow that passes tokens along. Medium: elsewhere. False positive:
        the value is checked against known paths first.
      fix: >-
        Only redirect to relative paths starting with a single "/", or to a fixed list of
        destinations.
    pattern-sources:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $URL.searchParams.get(...)
      - patterns:
          - pattern: $SP.get(...)
          - metavariable-regex:
              metavariable: $SP
              regex: ^(searchParams|params|query|qs|urlParams)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.redirect($TARGET)
              - pattern: $RES.redirect($CODE, $TARGET)
              - pattern: redirect($TARGET)
              - pattern: NextResponse.redirect($TARGET, ...)
          - focus-metavariable: $TARGET

  - id: vc-mass-assignment
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      The whole request body is written to the database. A user can add fields you didn't intend
      to accept, such as role: "admin", credits, or another user's id.
    metadata:
      title: Request body saved to the database as-is (mass assignment)
      level: medium
      cwe: "CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"
      confirm: >-
        Look at the table or model: if it has columns users must not set themselves (role,
        is_admin, plan, owner id, balance), send one of them in the request and see if it sticks.
      impact: >-
        High: the record has permission, billing or ownership fields. Medium: only harmless
        fields exist today. False positive: the body is validated with a strict schema first.
      fix: >-
        Pick the allowed fields explicitly ({ name, bio }) or validate with a schema (e.g. zod)
        that rejects unknown keys.
    patterns:
      - pattern-either:
          - pattern: '$DB.$MODEL.$OP({..., data: $REQ.body, ...})'
          - pattern: '$DB.$MODEL.$OP({..., data: await $REQ.json(), ...})'
          - pattern: $Q.$OP($REQ.body)
          - pattern: $Q.$OP(await $REQ.json())
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $BODY = await $REQ.json();
                      ...
                  - pattern-inside: |
                      $BODY = $REQ.body;
                      ...
              - pattern-either:
                  - pattern: '$DB.$MODEL.$OP({..., data: $BODY, ...})'
                  - pattern: $Q.$OP($BODY)
      - metavariable-regex:
          metavariable: $OP
          regex: ^(create|update|upsert|updateMany|createMany|insert)$

  # ---------------------------------------------------------------------------------------------
  # Auth, sessions and crypto
  # ---------------------------------------------------------------------------------------------
  - id: vc-jwt-not-verified
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      jwt.decode reads a token's claims without checking its signature, so anyone can make a
      token with any user id or role. That's only safe if the token was verified earlier on the
      same request.
    metadata:
      title: JWT read without checking its signature
      level: high
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      confirm: >-
        Check whether jwt.verify (or your auth library) runs on the same token before this. On a
        local copy, send a token with an edited payload and a wrong signature.
      impact: >-
        High: the claims decide who the user is or what they can do. Medium: they're only
        displayed. False positive: the token was verified earlier on the same request.
      fix: >-
        Use jwt.verify(token, secret, { algorithms: ['HS256'] }) (or your auth provider's SDK)
        and use the claims it returns.
    pattern: jwt.decode(...)

  - id: vc-tls-check-off
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      TLS certificate checking is turned off, so anyone on the network path can impersonate the
      server this code talks to and read or change the traffic, including credentials.
    metadata:
      title: TLS certificate checking turned off
      level: high
      cwe: "CWE-295: Improper Certificate Validation"
      confirm: >-
        Check whether this code runs in production and what it connects to (database, payment
        provider, internal API).
      impact: >-
        High: production traffic with credentials or user data. Low: local development only.
      fix: >-
        Remove the override. For a database with a private certificate authority, pass its CA
        certificate (ssl: { ca: ... }) instead of disabling checks.
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: vc-token-in-localstorage
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      A login or session token is stored in localStorage, where any script on the page can read
      it. One cross-site scripting bug, or one compromised npm package, is enough to steal it.
    metadata:
      title: Login token stored in localStorage
      level: medium
      cwe: "CWE-922: Insecure Storage of Sensitive Information"
      confirm: >-
        Check what's stored: open devtools > Application > Local Storage after logging in. A
        refresh token or long-lived token matters most.
      impact: >-
        High: a refresh or long-lived token. Medium: a short-lived access token. False positive:
        a non-secret value with a token-like name.
      fix: >-
        Keep the session in an httpOnly, Secure, SameSite cookie set by your server (Supabase and
        most auth libraries support this), and don't store tokens in localStorage.
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem($KEY, ...)
          - pattern: window.localStorage.setItem($KEY, ...)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(token|jwt|session|auth|access|refresh|credential).*

  - id: vc-unsanitized-html
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      HTML is inserted into the page with dangerouslySetInnerHTML without being sanitized. If the
      content can come from a user, it can run scripts in other users' browsers (XSS).
    metadata:
      title: HTML inserted without sanitizing (XSS)
      level: medium
      cwe: "CWE-79: Cross-site Scripting"
      confirm: >-
        Find where the HTML comes from. If a user can write it (bio, comment, message), save
        <img src=x onerror=alert(1)> locally and view it.
      impact: >-
        High: other users see content one user wrote. Medium: only the author sees it. False
        positive: the HTML is your own static content.
      fix: >-
        Render it as text, or sanitize it first: dangerouslySetInnerHTML={{ __html:
        DOMPurify.sanitize(html) }}.
    patterns:
      - pattern: '<$EL dangerouslySetInnerHTML={{__html: $HTML}} />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{__html: "..."}} />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{__html: $P.sanitize(...)}} />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{__html: sanitize(...)}} />'

  - id: vc-predictable-token
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Math.random() is used to make a token or code. It isn't designed to be unpredictable, so
      reset links, invite codes or one-time passwords made this way can be guessed.
    metadata:
      title: Guessable token made with Math.random()
      level: medium
      cwe: "CWE-338: Use of Cryptographically Weak PRNG"
      confirm: >-
        Check what the value is used for. Password reset, login, invite, verification and API
        tokens matter; UI ids and animations don't.
      impact: >-
        High: it grants access (reset link, login code). False positive: it's not security
        related.
      fix: >-
        Use crypto.randomUUID() or crypto.randomBytes(32).toString('hex') (Node), or
        crypto.getRandomValues() in the browser.
    patterns:
      - pattern-either:
          - pattern: $V = <... Math.random() ...>
          - pattern: const $V = <... Math.random() ...>
          - pattern: let $V = <... Math.random() ...>
      - metavariable-regex:
          metavariable: $V
          regex: (?i).*(token|secret|otp|code|password|passwd|reset|invite|nonce|apikey|api_key|salt).*

  - id: vc-fast-hash-for-password
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A password is hashed with a fast hash (MD5, SHA-1, SHA-256...). Fast hashes can be guessed
      billions of times per second, so a leaked database gives up most passwords quickly.
    metadata:
      title: Password hashed with a fast hash
      level: high
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      confirm: >-
        Check that the hashed value is a user's password (not a checksum or cache key).
      impact: >-
        High: stored user passwords. False positive: a non-password value with a password-like
        name.
      fix: >-
        Use bcrypt, scrypt or argon2 (e.g. await bcrypt.hash(password, 12)), or let your auth
        provider (Supabase Auth, Clerk, Auth.js) handle passwords.
    patterns:
      - pattern: $C.createHash(...).update($PW)
      - metavariable-regex:
          metavariable: $PW
          regex: (?i).*(password|passwd|pwd|passphrase).*

  - id: vc-cors-any-origin-with-cookies
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      CORS reflects any website's origin and allows credentials, so any site a logged-in user
      visits can call your API as that user and read the responses.
    metadata:
      title: CORS lets any website make logged-in requests
      level: medium
      cwe: "CWE-942: Permissive Cross-domain Policy"
      confirm: >-
        Check whether the API uses cookie sessions. Run curl -si -H 'Origin: https://example.org'
        against an API route and look for that origin echoed back with
        Access-Control-Allow-Credentials: true.
      impact: >-
        High: cookie sessions and user data. Medium: header-based auth with some cookie routes.
        False positive: a fully public API with no cookies.
      fix: >-
        Set origin to your own front-end URLs, e.g. origin: ['https://yourapp.com'].
    pattern-either:
      - pattern: "cors({..., origin: true, ..., credentials: true, ...})"
      - pattern: "cors({..., credentials: true, ..., origin: true, ...})"
